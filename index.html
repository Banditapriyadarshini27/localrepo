<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandita Priyadarshini — Software Developer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Generated Data URI Favicon featuring initials BP monogram in accent color -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' stroke='%23C68B5D' stroke-width='2' fill='none'/%3E%3Ctext x='12' y='15.5' font-family='sans-serif' font-size='9' font-weight='700' fill='%23C68B5D' text-anchor='middle'%3EBP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body class="light-mode">

<!-- Playful Runtime Error / compiler loading overlay screen -->
<div id="loadingScreen" role="dialog" aria-modal="true" aria-label="Loading portfolio" tabindex="-1">
  <div class="loading-container">
    <div class="loading-header">
      <div class="loading-dots">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
      <span class="loading-title">compiler.sh</span>
      <span class="loading-skip">Press any key to skip</span>
    </div>
    <div class="loading-body" id="loadingBody"></div>
  </div>
</div>

<div class="header">
  <div class="header-inner">
    <div class="header-logo">
      <!-- Monogram initials BP logo SVG in Accent Indigo -->
      <svg class="header-logo-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="var(--indigo)" stroke-width="2" fill="none"/>
        <text x="12" y="15.5" font-family="sans-serif" font-size="9" font-weight="700" fill="var(--indigo)" text-anchor="middle">BP</text>
      </svg>
      <span>bandita.dev</span>
    </div>
    <div class="navlinks-wrapper">
      <div class="navlinks">
        <a href="#about">about</a>
        <a href="#skills">skills</a>
        <a href="#projects">projects</a>
        <a href="#experience">experience</a>
        <a href="#education">education</a>
        <a href="#contact">contact</a>
      </div>
      <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle visual theme" tabindex="0">
        <!-- Sun icon (shown in Dark mode) -->
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <!-- Moon icon (shown in Light mode) -->
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </button>
    </div>
  </div>
</div>

<main id="app" class="wrap"></main>

<script src="script.js"></script>

</body>
</html>
